<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icon_dark.png">
    <title>Lecteur CBZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="css/view.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
            <div class="icon">
                <img alt="icon" style="display:none"> 
            </div>
            <button id="btn-biblio" class="btn-header">Bibliothèque (JSON)</button>
            <input type="file" id="jsonInput" accept=".json" style="display:none">
        </div>
        
        <div class="header-center">    
            <div id="drop-zone">
                Choisissez un <strong>.cbz</strong>
                <input type="file" id="fileInput" accept=".cbz,.zip" style="display:none">
            </div>
        </div>

        <div class="header-right">
            <button id="theme-switch" class="btn-icon"><strong>switch theme</strong></button>
            <div class="icon-zoom-moins"></div>
            <input type="range" id="zoom-slider" min="30" max="100" value="98">
            <div class="icon-zoom-plus"></div>
        </div>

        <div id="loader" class="loader">
            Chargement des pages...
        </div>

    </header>

    <main id="home-content">
        <!-- Last Read Section -->
        <div class="recent-reads-container" id="recent-reads-container">
            <div class="recent-reads-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <svg class="recent-icon" viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"></path></svg>
                    <h2>REPRENEZ VOTRE VISIONNAGE</h2>
                </div>
                <div class="recent-reads-nav">
                    <button class="nav-btn prev-btn">&larr;</button>
                    <button class="nav-btn next-btn">&rarr;</button>
                </div>
            </div>
            <div class="recent-reads-grid" id="recent-reads-grid">
                <!-- Cards will be injected here -->
            </div>
        </div>

        <!-- Library Container -->
        <div class="library-container" id="library-container" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                <h2 style="color: white; margin: 0; font-size: 18px;">VOTRE BIBLIOTHÈQUE</h2>
            </div>
            <div id="library-grid" class="library-grid"></div>
        </div>
    </main>

    <div id="viewer"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
