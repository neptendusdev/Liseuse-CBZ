<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icon_dark.png">
    <title>Lecteur CBZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="css/view.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <div class="icon">
                <img alt="icon" style="display:none"> 
            </div>
        </div>
        
        <div class="header-center">    
            <div id="drop-zone">
                Choisissez un <strong>.cbz</strong>
                <input type="file" id="fileInput" accept=".cbz,.zip" style="display:none">
            </div>
        </div>

        <div class="header-right">
            <button id="theme-switch" class="btn-icon"><strong>switch theme</strong></button>
            <div class="icon-zoom-moins"></div>
            <input type="range" id="zoom-slider" min="30" max="100" value="98">
            <div class="icon-zoom-plus"></div>
        </div>

        <div id="loader" class="loader">
            Chargement des pages...
        </div>

    </header>

    <div id="viewer"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
